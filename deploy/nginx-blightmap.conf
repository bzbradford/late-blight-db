#--- Blight map (staging) ---#
# /etc/nginx/sites-available/blightmap, symlinked into sites-enabled.
#
# Installed as plain HTTP; `sudo certbot --nginx -d blightmap.dev.agweather.cals.wisc.edu
# --redirect` then adds `listen 443 ssl`, the certificate lines, and the HTTP -> HTTPS
# redirect to this file. (nginx won't load a `listen 443 ssl` block with no certificate.)

server {
  listen 80;
  server_name blightmap.dev.agweather.cals.wisc.edu;

  access_log /var/log/nginx/blightmap_access.log combined;
  error_log /var/log/nginx/blightmap_error.log;

  # Staging: keep it out of search results.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # CSV imports post up to ~800 KB (the file, then the same text again on confirm).
  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app's rate limits key on this (ADDRESS_HEADER=X-Real-IP). Set here, it
    # replaces anything the client sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
