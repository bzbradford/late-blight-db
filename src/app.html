<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Pick the theme before first paint; waiting for hydration flashes the wrong one.
			An explicit choice (localStorage, key "theme") wins over the OS preference.
			$lib/state/theme.svelte.ts takes over after hydration and must use the same key.
		-->
		<script>
			(function () {
				var stored = null;
				try {
					stored = localStorage.getItem('theme');
				} catch (e) {}
				// Light unless the visitor chose dark; the OS setting is deliberately ignored.
				var dark = stored === 'dark';
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
